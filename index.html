<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Analítico - Mennar SAS</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .chat-container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 5px; padding: 10px; overflow-y: scroll; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 10px; border-radius: 5px; line-height: 1.4; }
        .user-msg { background: #d1e7dd; text-align: right; }
        .bot-msg { background: #cfe2ff; text-align: left; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        input[type="file"] { display: none; }
        .file-btn { background: #6c757d; color: white; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button.send-btn { background: #0d6efd; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        button.send-btn:hover { background: #0b5ed7; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Asistente Analítico - Mennar SAS</h2>
    <div id="chatBox" class="chat-box"></div>
    
    <div class="input-group">
        <label for="imageInput" class="file-btn">📷 Imagen</label>
        <input type="file" id="imageInput" accept="image/*">
        <input type="text" id="questionInput" placeholder="Escribe tu consulta sobre dispensación..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    let base64Image = null;

    document.getElementById('imageInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = function() {
                base64Image = reader.result;
                alert("Imagen cargada y lista para enviar.");
            }
            reader.readAsDataURL(file);
        }
    });

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    async function sendMessage() {
        const qInput = document.getElementById('questionInput');
        const chatBox = document.getElementById('chatBox');
        const question = qInput.value.trim();

        if (!question && !base64Image) return;

        // Mostrar mensaje del usuario
        chatBox.innerHTML += `<div class="message user-msg"><b>Tú:</b> ${question}</div>`;
        qInput.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('http://127.0.0.1:5000/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: question, image: base64Image })
            });

            const data = await response.json();
            
            // Mostrar respuesta del bot
            chatBox.innerHTML += `<div class="message bot-msg"><b>Asistente:</b> ${data.response}</div>`;
        } catch (error) {
            chatBox.innerHTML += `<div class="message bot-msg" style="color:red;"><b>Error:</b> No se pudo conectar con el servidor Flask.</div>`;
        }

        base64Image = null;
        document.getElementById('imageInput').value = '';
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
