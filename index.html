<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de IA & Dashboard Mennar SAS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1a252f;
            color: #ffffff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            font-size: 1.4rem;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .dashboard-container {
            flex: 3;
            border-right: 2px solid #e0e0e0;
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-container {
            flex: 1;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            padding: 20px;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #fafafa;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }

        .bot-message {
            background-color: #e9ecef;
            color: #333;
            margin-right: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background-color: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #218838;
        }

        button.mic-btn {
            background-color: #17a2b8;
        }

        button.mic-btn:hover {
            background-color: #138496;
        }

        button.recording {
            background-color: #dc3545;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Consola Analítica & Asistente de Voz - Mennar SAS</h1>
        <span id="status" style="font-size: 0.85rem; color: #28a745;">● En línea</span>
    </header>

    <div class="container">
        <!-- Power BI Dashboard Embed -->
        <div class="dashboard-container">
            <iframe title="Power BI Dashboard" src="https://app.powerbi.com/view?r=eyJrIjoiMDllNmM1ODUtMDM1YS00YzE2LThjYWItOTY3ZTlmYzkxYWViIiwidCI6IjI0YzRmMjViLTk1MDYtNGFjMS05MmExLThlYzljNmFiYmFlZSIsImMiOjR9" allowFullName="true"></iframe>
        </div>

        <!-- Panel de Chat / Voz -->
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message bot-message">
                    Hola, soy tu asistente de datos. Puedes hacerme preguntas por escrito o usando el micrófono.
                </div>
            </div>

            <div class="controls">
                <input type="text" id="userInput" placeholder="Escribe tu consulta..." onkeypress="handleKeyPress(event)">
                <button class="mic-btn" id="micBtn" onclick="toggleRecognition()">🎤</button>
                <button onclick="enviarConsulta()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // URL pública de tu backend servida a través de ngrok
        const BACKEND_URL = 'https://polish-capitol-construct.ngrok-free.dev/ask';

        let recognition;
        let isRecording = false;

        // Configuración de Reconocimiento de Voz (Web Speech API)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'es-ES';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                document.getElementById('userInput').value = transcript;
                enviarConsulta();
            };

            recognition.onerror = (event) => {
                console.error("Error de voz:", event.error);
                stopRecording();
            };

            recognition.onend = () => {
                stopRecording();
            };
        } else {
            document.getElementById('micBtn').style.display = 'none';
            console.warn("Navegador no soporta Web Speech API");
        }

        function toggleRecognition() {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
                stopRecording();
            } else {
                recognition.start();
                startRecording();
            }
        }

        function startRecording() {
            isRecording = true;
            const btn = document.getElementById('micBtn');
            btn.classList.add('recording');
            btn.innerText = '🛑';
        }

        function stopRecording() {
            isRecording = false;
            const btn = document.getElementById('micBtn');
            btn.classList.remove('recording');
            btn.innerText = '🎤';
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Cancelar lecturas previas
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function enviarConsulta() {
            const input = document.getElementById('userInput');
            const question = input.value.trim();

            if (!question) return;

            appendMessage(question, 'user-message');
            input.value = '';

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });

                if (!response.ok) {
                    throw new Error(`Error en servidor: ${response.status}`);
                }

                const data = await response.json();
                const botReply = data.response || "No recibí respuesta.";

                appendMessage(botReply, 'bot-message');
                speak(botReply);

            } catch (err) {
                console.error(err);
                const errorMsg = "Ocurrió un problema de conexión con el backend local.";
                appendMessage(errorMsg, 'bot-message');
                speak(errorMsg);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                enviarConsulta();
            }
        }
    </script>
</body>
</html>
